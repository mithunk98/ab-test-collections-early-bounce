name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Pinned: ruff's default rule set changes between releases, so an
          # unpinned version turns a green build red on someone else's schedule.
          pip install ruff==0.16.6

      - name: Lint
        run: ruff check src/ --output-format=github

      - name: Verify every module imports cleanly
        # PYTHONPATH=src reproduces what `python src/step2_power.py` does implicitly:
        # the script's own directory goes on sys.path, which is how `import config`
        # resolves. Without it every step module fails to import here but works when
        # run directly - a CI failure that says nothing about the code.
        env:
          PYTHONPATH: src
        run: |
          for f in src/*.py; do
            echo "--- $f"
            python -c "import runpy,sys; sys.argv=['$f']; runpy.run_path('$f', run_name='__imported__')" \
              || { echo "FAILED to import $f"; exit 1; }
          done

      # The pipeline has a simulation mode, which makes a real end-to-end smoke
      # test possible without any private data. Uncomment once you confirm the
      # invocation and that steps 1-4 run clean from a fresh checkout.
      #
      # - name: End-to-end smoke test (simulated outcomes)
      #   run: |
      #     python src/step1_cohort.py
      #     python src/step2_power.py
      #     python src/step3_randomize.py
      #     python src/step4_analyze.py
